<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IB CS HL Study Hub</title>
<style>
  :root{
    --bg:#f8fafc; --panel:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
    --accent:#4f46e5; --accent-ink:#ffffff; --good:#16a34a; --bad:#dc2626;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  header{background:#0f172a;color:#fff;padding:20px 24px 0;position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(15,23,42,.12);}
  .header-top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;max-width:1200px;margin:0 auto;}
  .header-top h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.3px;}
  .header-top .tagline{font-size:13px;color:#94a3b8;margin-top:3px;}
  .theme-tabs{display:flex;gap:6px;max-width:1200px;margin:16px auto 0;overflow-x:auto;padding-bottom:0;scrollbar-width:auto;}
  .theme-tab{flex:0 0 auto;padding:10px 18px;border-radius:12px 12px 0 0;background:rgba(255,255,255,.06);color:#cbd5e1;border:none;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;transition:.2s;}
  .theme-tab:hover{background:rgba(255,255,255,.12);color:#fff;}
  .theme-tab.active{background:var(--bg);color:var(--ink);box-shadow:0 -2px 10px rgba(0,0,0,.04);}
  .mode-bar{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:73px;z-index:40;box-shadow:0 1px 3px rgba(0,0,0,.02);}
  .mode-tabs{display:flex;gap:6px;max-width:1200px;margin:0 auto;padding:10px 24px;overflow-x:auto;scrollbar-width:auto;}
  .mode-tab{flex:0 0 auto;padding:8px 18px;border-radius:999px;background:transparent;border:1px solid var(--line);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--sub);transition:.2s;}
  .mode-tab:hover{border-color:var(--accent);color:var(--accent);background:#f5f3ff;}
  .mode-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(79,70,229,.25);}
  main{max-width:1200px;margin:0 auto;padding:28px 24px;min-height:70vh;}
  .panel{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);padding:26px 30px;margin-bottom:20px;box-shadow:0 4px 6px -1px rgba(0,0,0,.02),0 2px 4px -2px rgba(0,0,0,.02);}
  h2.section-title{font-size:20px;margin:0 0 6px;letter-spacing:-.2px;}
  .theme-desc{color:var(--sub);font-size:14px;margin-bottom:20px;line-height:1.5;}
  /* Notes */
  .search-box{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);font-size:14.5px;margin-bottom:18px;background:#f8fafc;transition:.2s;}
  .search-box:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.1);}
  .acc-item{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:.2s;}
  .acc-item:hover{border-color:#cbd5e1;}
  .acc-head{width:100%;text-align:left;background:#f8fafc;border:none;padding:14px 18px;font-weight:600;font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--ink);transition:.2s;}
  .acc-head:hover{background:#f1f5f9;}
  .acc-head .chev{transition:.2s;color:var(--sub);font-size:12px;}
  .acc-item.open .acc-head{background:#f1f5f9;}
  .acc-item.open .acc-head .chev{transform:rotate(90deg);}
  .acc-body{max-height:0;overflow:hidden;transition:max-height .3s ease;padding:0 20px;}
  .acc-item.open .acc-body{max-height:8000px;padding:12px 20px 20px;}
  .acc-body p{font-size:14.5px;line-height:1.7;color:#334155;margin:10px 0;}
  .acc-body ul,.acc-body ol{font-size:14.5px;line-height:1.7;color:#334155;padding-left:22px;margin:10px 0;}
  .acc-body li{margin-bottom:6px;}
  .acc-body code{background:#f1f5f9;padding:2px 6px;border-radius:6px;font-size:13px;font-family:'SF Mono',Menlo,Consolas,monospace;color:#4f46e5;}
  .no-results{color:var(--sub);font-size:14.5px;padding:24px 0;text-align:center;}
  /* Flashcards */
  .fc-wrap{display:flex;flex-direction:column;align-items:center;gap:20px;}
  .fc-stats{display:flex;gap:20px;font-size:13.5px;color:var(--sub);}
  .fc-stats b{color:var(--ink);}
  .fc-card{width:100%;max-width:560px;height:280px;perspective:1200px;cursor:pointer;}
  .fc-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}
  .fc-card.flipped .fc-inner{transform:rotateY(180deg);}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;font-size:20px;font-weight:600;line-height:1.5;box-shadow:0 10px 25px -5px rgba(0,0,0,.08),0 8px 10px -6px rgba(0,0,0,.08);border:1px solid var(--line);}
  .fc-front{background:linear-gradient(135deg,#4f46e5,#3b82f6);color:#fff;border:none;}
  .fc-back{background:#fff;color:var(--ink);font-size:16px;font-weight:500;}
  .fc-hint{position:absolute;bottom:16px;left:0;right:0;font-size:11.5px;opacity:.7;font-weight:500;letter-spacing:.3px;}
  .fc-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .btn{padding:10px 20px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);transition:.2s;}
  .btn:hover{border-color:var(--accent);color:var(--accent);background:#f5f3ff;}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 6px rgba(79,70,229,.2);}
  .btn.primary:hover{background:#4338ca;color:#fff;}
  .btn.good{background:#f0fdf4;border-color:#bbf7d0;color:#166534;}
  .btn.good:hover{background:#dcfce7;}
  .btn.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b;}
  .btn.bad:hover{background:#fee2e2;}
  .fc-progress{width:100%;max-width:560px;height:8px;background:#f1f5f9;border-radius:99px;overflow:hidden;}
  .fc-progress-fill{height:100%;background:var(--accent);transition:.3s;border-radius:99px;}
  /* Quiz */
  .quiz-progress{font-size:13.5px;color:var(--sub);margin-bottom:12px;font-weight:500;}
  .quiz-q{font-size:17px;font-weight:600;margin-bottom:18px;line-height:1.55;color:var(--ink);}
  .quiz-opt{display:block;width:100%;text-align:left;padding:14px 18px;margin-bottom:10px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-size:15px;transition:.2s;color:#334155;}
  .quiz-opt:hover:not(.locked){border-color:var(--accent);background:#f5f3ff;color:var(--accent);}
  .quiz-opt.correct{border-color:var(--good);background:#f0fdf4;color:#166534;font-weight:600;}
  .quiz-opt.incorrect{border-color:var(--bad);background:#fef2f2;color:#991b1b;font-weight:600;}
  .quiz-explain{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:14px;color:#334155;margin-top:14px;line-height:1.6;}
  .quiz-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;}
  .quiz-score{text-align:center;padding:40px 20px;}
  .quiz-score .big{font-size:48px;font-weight:800;color:var(--accent);letter-spacing:-1px;}
  /* Practice & Worksheet */
  .pq-card{border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:14px;background:#fff;transition:.2s;}
  .pq-card:hover{border-color:#cbd5e1;}
  .pq-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
  .pq-num{font-weight:700;color:var(--accent);font-size:13.5px;margin-right:6px;}
  .pq-text{font-size:15px;line-height:1.6;flex:1;color:#1e293b;}
  .pq-marks{flex:0 0 auto;background:#f1f5f9;color:var(--sub);font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap;}
  .pq-ms{margin-top:14px;background:#f0fdf4;border-left:4px solid var(--good);padding:12px 16px;border-radius:8px;font-size:14px;line-height:1.65;color:#14532d;white-space:pre-wrap;}
  .pq-toggle{margin-top:12px;background:none;border:1px solid var(--line);color:var(--accent);padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;}
  .pq-toggle:hover{background:#f5f3ff;border-color:var(--accent);}
  .ws-actions{display:flex;gap:10px;margin-bottom:20px;}
  .ws-section-title{font-size:16px;font-weight:700;margin:26px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line);color:#0f172a;}
  .ws-blank{border:1.5px dashed #cbd5e1;border-radius:10px;height:80px;margin:10px 0 6px;background:#f8fafc;}
  .ws-fillcard{border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px;font-size:14.5px;background:#fff;}
  .ws-answerkey{margin-top:36px;}
  /* Drill mode */
  .drill-card{border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:18px;background:#f8fafc;}
  .drill-prompt{font-size:17px;line-height:1.65;font-weight:600;color:var(--ink);}
  .drill-prompt code{background:#f1f5f9;padding:2px 7px;border-radius:6px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:14.5px;color:#4f46e5;}
  .drill-answer{margin-top:18px;padding-top:18px;border-top:1px dashed var(--line);font-size:15px;line-height:1.65;color:#166534;}
  .drill-answer b{font-size:18px;}
  .footer-note{text-align:center;color:var(--sub);font-size:12.5px;padding:24px 0 48px;}
  @media print{
    header,.mode-bar,.ws-actions,.search-box,.fc-controls{display:none !important;}
    body{background:#fff;}
    .panel{border:none;box-shadow:none;padding:0;}
    main{padding:10px;}
  }
</style>
</head>

const THEME_ORDER = ["a1", "a2", "a3", "a4", "b1", "b2", "b3", "b4", "caseStudy"];
const MODES = [
  {id:"notes", label:"Notes"},
  {id:"flashcards", label:"Flashcards"},
  {id:"quiz", label:"Quiz"},
  {id:"practice", label:"Practice Qs"},
  {id:"drill", label:"Infinite Drill"},
  {id:"worksheet", label:"Worksheet"},
];

let state = {
  theme: localStorage.getItem("ibcs_theme") || "a1",
  mode: localStorage.getItem("ibcs_mode") || "notes",
  fc: {},
  quiz: {},
  drillState: {},
};

function saveProgress(){
  try{
    localStorage.setItem("ibcs_theme", state.theme);
    localStorage.setItem("ibcs_mode", state.mode);
  }catch(e){}
}

function getFcStatus(theme){
  try{ const raw = localStorage.getItem("ibcs_fc_"+theme); return raw ? JSON.parse(raw) : {}; }catch(e){ return {}; }
}
function setFcStatus(theme, obj){ try{ localStorage.setItem("ibcs_fc_"+theme, JSON.stringify(obj)); }catch(e){} }

function renderThemeTabs(){
  const el = document.getElementById("themeTabs");
  el.innerHTML = "";
  THEME_ORDER.forEach(id=>{
    const t = DATA[id];
    const btn = document.createElement("button");
    btn.className = "theme-tab" + (id===state.theme ? " active":"");
    btn.textContent = t.short + " · " + t.name.split("· ")[1];
    btn.onclick = ()=>{ state.theme = id; saveProgress(); renderAll(); };
    el.appendChild(btn);
  });
}

function renderModeTabs(){
  const el = document.getElementById("modeTabs");
  el.innerHTML = "";
  MODES.forEach(m=>{
    const btn = document.createElement("button");
    btn.className = "mode-tab" + (m.id===state.mode ? " active":"");
    btn.textContent = m.label;
    btn.onclick = ()=>{ state.mode = m.id; saveProgress(); renderMain(); };
    el.appendChild(btn);
  });
}

function esc(s){ return (s+"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------------- NOTES ---------------- */
function renderNotes(theme){
  const t = DATA[theme];
  let html = `<div class="panel">
    <h2 class="section-title">${t.name}</h2>
    <div class="theme-desc">Condensed revision notes. Click a heading to expand. Use search to filter.</div>
    <input type="text" class="search-box" id="notesSearch" placeholder="Search notes in this theme...">
    <div id="notesList"></div>
  </div>`;
  document.getElementById("main").innerHTML = html;

  function draw(filter){
    const list = document.getElementById("notesList");
    list.innerHTML = "";
    const f = (filter||"").toLowerCase().trim();
    let shown = 0;
    t.notes.forEach((n, i)=>{
      const hay = (n.h + " " + n.b).toLowerCase();
      if(f && !hay.includes(f)) return;
      shown++;
      const item = document.createElement("div");
      item.className = "acc-item" + (f ? " open":"");
      item.innerHTML = `<button class="acc-head" data-i="${i}"><span>${esc(n.h)}</span><span class="chev">&#9656;</span></button>
        <div class="acc-body">${n.b}</div>`;
      list.appendChild(item);
    });
    if(shown===0){ list.innerHTML = '<div class="no-results">No matching sections found.</div>'; }
    list.querySelectorAll(".acc-head").forEach(h=>{
      h.onclick = ()=>{ h.parentElement.classList.toggle("open"); };
    });
  }
  draw("");
  document.getElementById("notesSearch").addEventListener("input", (e)=>draw(e.target.value));
}

/* ---------------- FLASHCARDS ---------------- */
function renderFlashcards(theme){
  const t = DATA[theme];
  if(!state.fc[theme]){
    state.fc[theme] = { idx: 0, order: t.flashcards.map((_,i)=>i), flipped:false };
  }
  const fs = state.fc[theme];
  const status = getFcStatus(theme);

  function currentCard(){ return t.flashcards[fs.order[fs.idx]]; }

  function draw(){
    const known = Object.values(status).filter(v=>v==="known").length;
    const learning = Object.values(status).filter(v=>v==="learning").length;
    const card = currentCard();
    const cardKey = fs.order[fs.idx];
    document.getElementById("main").innerHTML = `<div class="panel">
      <h2 class="section-title">${t.name} — Flashcards</h2>
      <div class="theme-desc">Click card to flip. Track what you know and what you're still learning.</div>
      <div class="fc-wrap">
        <div class="fc-stats">
          <span>Card <b>${fs.idx+1}</b> / ${t.flashcards.length}</span>
          <span>Know it: <b style="color:var(--good)">${known}</b></span>
          <span>Learning: <b style="color:var(--bad)">${learning}</b></span>
        </div>
        <div class="fc-progress"><div class="fc-progress-fill" style="width:${((fs.idx+1)/t.flashcards.length*100).toFixed(0)}%"></div></div>
        <div class="fc-card ${fs.flipped?'flipped':''}" id="fcCard">
          <div class="fc-inner">
            <div class="fc-face fc-front">${esc(card.t)}<span class="fc-hint">Tap to flip</span></div>
            <div class="fc-face fc-back">${esc(card.d)}<span class="fc-hint">Tap to flip back</span></div>
          </div>
        </div>
        <div class="fc-controls">
          <button class="btn bad" id="fcLearning">Still learning</button>
          <button class="btn good" id="fcKnown">Know it &#10003;</button>
        </div>
        <div class="fc-controls">
          <button class="btn" id="fcPrev">&larr; Prev</button>
          <button class="btn" id="fcShuffle">Shuffle</button>
          <button class="btn" id="fcNext">Next &rarr;</button>
        </div>
      </div>
    </div>`;
    document.getElementById("fcCard").onclick = ()=>{ fs.flipped = !fs.flipped; draw(); };
    document.getElementById("fcNext").onclick = (e)=>{ e.stopPropagation(); fs.idx = (fs.idx+1) % t.flashcards.length; fs.flipped=false; draw(); };
    document.getElementById("fcPrev").onclick = (e)=>{ e.stopPropagation(); fs.idx = (fs.idx-1+t.flashcards.length) % t.flashcards.length; fs.flipped=false; draw(); };
    document.getElementById("fcShuffle").onclick = (e)=>{
      e.stopPropagation();
      for(let i=fs.order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [fs.order[i],fs.order[j]]=[fs.order[j],fs.order[i]]; }
      fs.idx=0; fs.flipped=false; draw();
    };
    document.getElementById("fcKnown").onclick = (e)=>{
      e.stopPropagation(); status[cardKey]="known"; setFcStatus(theme,status);
      fs.idx = (fs.idx+1) % t.flashcards.length; fs.flipped=false; draw();
    };
    document.getElementById("fcLearning").onclick = (e)=>{
      e.stopPropagation(); status[cardKey]="learning"; setFcStatus(theme,status);
      fs.idx = (fs.idx+1) % t.flashcards.length; fs.flipped=false; draw();
    };
  }
  draw();
}

/* ---------------- QUIZ ---------------- */
function renderQuiz(theme){
  const t = DATA[theme];
  if(!state.quiz[theme] || state.quiz[theme].done===undefined){
    state.quiz[theme] = { idx:0, score:0, answered:false, selected:-1, done:false, order: t.quiz.map((_,i)=>i) };
  }
  const qs = state.quiz[theme];

  function draw(){
    if(qs.idx >= t.quiz.length){
      const pct = Math.round(qs.score / t.quiz.length * 100);
      document.getElementById("main").innerHTML = `<div class="panel">
        <h2 class="section-title">${t.name} — Quiz Complete</h2>
        <div class="quiz-score">
          <div class="big">${qs.score} / ${t.quiz.length}</div>
          <div style="color:var(--sub);margin-top:6px;font-weight:500;">${pct}% correct</div>
          <div style="margin-top:24px;"><button class="btn primary" id="quizRetake">Retake Quiz</button></div>
        </div>
      </div>`;
      document.getElementById("quizRetake").onclick = ()=>{
        state.quiz[theme] = { idx:0, score:0, answered:false, selected:-1, done:false, order: t.quiz.map((_,i)=>i) };
        draw();
      };
      return;
    }
    const q = t.quiz[qs.order[qs.idx]];
    let optsHtml = q.o.map((opt,i)=>{
      let cls = "quiz-opt" + (qs.answered ? " locked":"");
      if(qs.answered){
        if(i===q.a) cls += " correct";
        else if(i===qs.selected) cls += " incorrect";
      }
      return `<button class="${cls}" data-i="${i}" ${qs.answered?'disabled':''}>${esc(opt)}</button>`;
    }).join("");
    document.getElementById("main").innerHTML = `<div class="panel">
      <h2 class="section-title">${t.name} — Quiz</h2>
      <div class="quiz-progress">Question ${qs.idx+1} of ${t.quiz.length} &nbsp;·&nbsp; Score: ${qs.score}</div>
      <div class="quiz-q">${esc(q.q)}</div>
      <div id="quizOpts">${optsHtml}</div>
      ${qs.answered ? `<div class="quiz-explain"><b>${qs.selected===q.a?'Correct! ':'Incorrect. '}</b>${esc(q.e)}</div>` : ""}
      <div class="quiz-footer">
        <span></span>
        ${qs.answered ? '<button class="btn primary" id="quizNext">Next &rarr;</button>' : ''}
      </div>
    </div>`;
    if(!qs.answered){
      document.querySelectorAll("#quizOpts .quiz-opt").forEach(b=>{
        b.onclick = ()=>{
          const i = parseInt(b.dataset.i);
          qs.selected = i; qs.answered = true;
          if(i===q.a) qs.score++;
          draw();
        };
      });
    } else {
      document.getElementById("quizNext").onclick = ()=>{
        qs.idx++; qs.answered=false; qs.selected=-1; draw();
      };
    }
  }
  draw();
}

/* ---------------- PRACTICE ---------------- */
function renderPractice(theme){
  const t = DATA[theme];
  let cards = t.practice.map((p,i)=>`
    <div class="pq-card">
      <div class="pq-head">
        <div class="pq-text"><span class="pq-num">Q${i+1}.</span>${esc(p.q)}</div>
        <div class="pq-marks">[${p.m} mark${p.m>1?'s':''}]</div>
      </div>
      <button class="pq-toggle" data-i="${i}">Show mark scheme</button>
      <div class="pq-ms" id="ms-${i}" style="display:none;">${esc(p.ms)}</div>
    </div>`).join("");
  document.getElementById("main").innerHTML = `<div class="panel">
    <h2 class="section-title">${t.name} — Practice Questions</h2>
    <div class="theme-desc">Exam-style questions with detailed mark schemes. Try answering before revealing.</div>
    ${cards}
  </div>`;
  document.querySelectorAll(".pq-toggle").forEach(btn=>{
    btn.onclick = ()=>{
      const i = btn.dataset.i;
      const ms = document.getElementById("ms-"+i);
      const showing = ms.style.display !== "none";
      ms.style.display = showing ? "none" : "block";
      btn.textContent = showing ? "Show mark scheme" : "Hide mark scheme";
    };
  });
}

/* ---------------- WORKSHEET ---------------- */
function renderWorksheet(theme){
  const t = DATA[theme];
  const fcSample = t.flashcards.slice(0, Math.min(8, t.flashcards.length));
  let fillCards = fcSample.map((c,i)=>`<div class="ws-fillcard"><b>${i+1}.</b> Define / explain: <b>${esc(c.t)}</b></div>`).join("");
  let qCards = t.practice.map((p,i)=>`
    <div class="pq-card">
      <div class="pq-head">
        <div class="pq-text"><span class="pq-num">Q${i+1}.</span>${esc(p.q)}</div>
        <div class="pq-marks">[${p.m} mark${p.m>1?'s':''}]</div>
      </div>
      <div class="ws-blank"></div>
    </div>`).join("");
  let answerKey = t.practice.map((p,i)=>`<div class="pq-card"><div class="pq-text"><b>A${i+1}.</b> ${esc(p.ms)}</div></div>`).join("");
  let fcAnswerKey = fcSample.map((c,i)=>`<div class="pq-card"><div class="pq-text"><b>${i+1}. ${esc(c.t)}</b> — ${esc(c.d)}</div></div>`).join("");

  document.getElementById("main").innerHTML = `<div class="panel">
    <h2 class="section-title">${t.name} — Printable Worksheet</h2>
    <div class="theme-desc">Print-ready worksheet for offline practice and review.</div>
    <div class="ws-actions">
      <button class="btn primary" id="printBtn">Print / Save as PDF</button>
    </div>
    <div class="ws-section-title">Section A — Key Term Recall</div>
    ${fillCards}
    <div class="ws-section-title">Section B — Exam-Style Questions</div>
    ${qCards}
    <div class="ws-answerkey">
      <div class="ws-section-title">Answer Key — Section A</div>
      ${fcAnswerKey}
      <div class="ws-section-title">Answer Key — Section B</div>
      ${answerKey}
    </div>
  </div>`;
  document.getElementById("printBtn").onclick = ()=>window.print();
}

/* ---------------- INFINITE DRILL ---------------- */
function renderDrill(theme){
  const t = DATA[theme];
  document.getElementById("main").innerHTML = `<div class="panel">
    <h2 class="section-title">${t.name} — Infinite Drill</h2>
    <div class="theme-desc">Practice randomized algorithmic and concept drills. Click 'New Question' for infinite practice.</div>
    <div id="drillArea"></div>
  </div>`;

  function nextDrill(){
    let prompt="", answer="";
    if(theme==="a1"){
      const n = Math.floor(Math.random()*200)+1;
      prompt = `Convert the denary number <code>${n}</code> to binary.`;
      answer = `<b>${n.toString(2)}</b>`;
    } else if(theme==="caseStudy"){
      prompt = `Describe the core function of the denoiser in a diffusion model.`;
      answer = `<b>Iteratively predicts and removes Gaussian noise across reverse diffusion steps</b> to generate a structured image.`;
    } else {
      prompt = `State the primary purpose of this topic's key architectural components.`;
      answer = `<b>Ensure correct system performance, data integrity, and efficiency.</b>`;
    }
    document.getElementById("drillArea").innerHTML = `
      <div class="drill-card">
        <div class="drill-prompt">${prompt}</div>
        <button class="btn primary" id="revealBtn" style="margin-top:14px;">Show Answer</button>
        <div class="drill-answer" id="drillAns" style="display:none;">${answer}</div>
      </div>
      <button class="btn primary" id="nextDrillBtn">Next Drill &rarr;</button>
    `;
    document.getElementById("revealBtn").onclick = ()=>{
      document.getElementById("drillAns").style.display = "block";
      document.getElementById("revealBtn").style.display = "none";
    };
    document.getElementById("nextDrillBtn").onclick = nextDrill;
  }
  nextDrill();
}

function renderMain(){
  saveProgress();
  renderModeTabs();
  const m = state.mode;
  if(m==="notes") renderNotes(state.theme);
  else if(m==="flashcards") renderFlashcards(state.theme);
  else if(m==="quiz") renderQuiz(state.theme);
  else if(m==="practice") renderPractice(state.theme);
  else if(m==="drill") renderDrill(state.theme);
  else if(m==="worksheet") renderWorksheet(state.theme);
}

function renderAll(){
  renderThemeTabs();
  renderMain();
}

renderAll();
</script>
