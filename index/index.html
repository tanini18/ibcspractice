n. In composition, the part CANNOT exist without the whole."}, {"q": "Which Java keyword explicitly calls the parent class's constructor?", "o": ["this", "super", "extends", "new"], "a": 1, "e": "super() calls the parent class's constructor before the child constructor's own code runs."}, {"q": "Can an abstract class be instantiated directly?", "o": ["Yes, always", "No, never", "Only in Python", "Only if it has no methods"], "a": 1, "e": "Abstract classes exist only to be extended — they cannot be instantiated directly."}], "practice": [{"q": "Distinguish between method overloading and method overriding, with an example of each.", "m": 4, "ms": "Overloading: multiple methods in the SAME class share a name but differ in parameter list, resolved at compile time (static polymorphism) (2) — e.g. add(int a) and add(int a, int b). Overriding: a SUBCLASS redefines a method inherited from its parent with the same signature, resolved at run time based on the object's actual type (dynamic polymorphism) (2) — e.g. Dog overriding Animal's makeSound()."}, {"q": "Distinguish between composition and aggregation, with an example of each.", "m": 4, "ms": "Composition is a strong 'has-a' relationship where the part cannot exist without the whole — if the whole is destroyed, so is the part (2), e.g. a House is composed of Rooms. Aggregation is a weaker 'has-a' relationship where the part can exist independently of the whole (2), e.g. a University has Students who still exist if they leave or the university closes."}, {"q": "Construct a class definition (in pseudocode or code) for a BankAccount with a private balance, a constructor, and public getter/setter methods that validate the balance cannot go negative.", "m": 6, "ms": "class BankAccount {\\n  private double balance;\\n  public BankAccount(double initial) { balance = initial; }\\n  public double getBalance() { return balance; }\\n  public void setBalance(double b) {\\n    if (b >= 0) { balance = b; }\\n  }\\n}\\nMarks for: private field (1), constructor initialising state (1), public getter (1), public setter (1), validation logic (1), overall correct encapsulation structure (1)."}, {"q": "Evaluate one advantage and one disadvantage of using OOP for a large software project.", "m": 3, "ms": "Advantage: encapsulation and modularity make large codebases easier to maintain, test, and extend as a team, since each class's internal detail is protected and can be worked on independently (1-2). Disadvantage: OOP has a steeper learning curve than simple procedural programming, and poorly designed class hierarchies can become rigid and hard to change later (1-2). (Max 3 marks — needs both an advantage and a disadvantage.)"}, {"q": "Explain how the singleton design pattern is implemented and why it is useful.", "m": 4, "ms": "The class's constructor is made private, so it cannot be instantiated directly from outside the class (1). A static method (e.g. getInstance()) checks whether an instance already exists; if not, it creates one, and always returns that same single instance (1). This guarantees only one instance of the class ever exists, with one global access point to it (1). It is useful for shared resources like a configuration manager or a single database connection, where having multiple independent instances could cause conflicts or wasted resources (1)."}, {"q": "Distinguish between static and non-static class members.", "m": 3, "ms": "A static member belongs to the class itself — there is only one shared copy used by every object of that class, accessed via ClassName.member (1-2), e.g. a counter tracking how many objects have been created. A non-static (instance) member belongs to each individual object, which has its own separate copy, accessed via objectReference.member (1), e.g. each Student object's own name."}]}};
const THEME_ORDER = ["a1", "a2", "b1", "b2", "b3"];
const MODES = [
  {id:"notes", label:"Notes"},
  {id:"flashcards", label:"Flashcards"},
  {id:"quiz", label:"Quiz"},
  {id:"practice", label:"Practice Qs"},
  {id:"worksheet", label:"Worksheet"},
];

let state = {
  theme: localStorage.getItem("ibcs_theme") || "a1",
  mode: localStorage.getItem("ibcs_mode") || "notes",
  fc: {}, // per-theme flashcard runtime state
  quiz: {}, // per-theme quiz runtime state
};

function saveProgress(){
  try{
    localStorage.setItem("ibcs_theme", state.theme);
    localStorage.setItem("ibcs_mode", state.mode);
  }catch(e){}
}

function getFcStatus(theme){
  try{
    const raw = localStorage.getItem("ibcs_fc_"+theme);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function setFcStatus(theme, obj){
  try{ localStorage.setItem("ibcs_fc_"+theme, JSON.stringify(obj)); }catch(e){}
}

function renderThemeTabs(){
  const el = document.getElementById("themeTabs");
  el.innerHTML = "";
  THEME_ORDER.forEach(id=>{
    const t = DATA[id];
    const btn = document.createElement("button");
    btn.className = "theme-tab" + (id===state.theme ? " active":"");
    btn.textContent = t.short + " · " + t.name.split("· ")[1];
    btn.onclick = ()=>{ state.theme = id; saveProgress(); renderAll(); };
    el.appendChild(btn);
  });
}

function renderModeTabs(){
  const el = document.getElementById("modeTabs");
  el.innerHTML = "";
  MODES.forEach(m=>{
    const btn = document.createElement("button");
    btn.className = "mode-tab" + (m.id===state.mode ? " active":"");
    btn.textContent = m.label;
    btn.onclick = ()=>{ state.mode = m.id; saveProgress(); renderMain(); };
    el.appendChild(btn);
  });
}

function esc(s){ return (s+"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---------------- NOTES ---------------- */
function renderNotes(theme){
  const t = DATA[theme];
  let html = `<div class="panel">
    <h2 class="section-title">${t.name}</h2>
    <div class="theme-desc">Condensed revision notes. Click a heading to expand. Use search to filter.</div>
    <input type="text" class="search-box" id="notesSearch" placeholder="Search notes in this theme (e.g. 'cache', 'TCP', 'recursion')...">
    <div id="notesList"></div>
  </div>`;
  document.getElementById("main").innerHTML = html;

  function draw(filter){
    const list = document.getElementById("notesList");
    list.innerHTML = "";
    const f = (filter||"").toLowerCase().trim();
    let shown = 0;
    t.notes.forEach((n, i)=>{
      const hay = (n.h + " " + n.b).toLowerCase();
      if(f && !hay.includes(f)) return;
      shown++;
      const item = document.createElement("div");
      item.className = "acc-item" + (f ? " open":"");
      item.innerHTML = `<button class="acc-head" data-i="${i}"><span>${esc(n.h)}</span><span class="chev">&#9656;</span></button>
        <div class="acc-body">${n.b}</div>`;
      list.appendChild(item);
    });
    if(shown===0){ list.innerHTML = '<div class="no-results">No matching sections. Try a different search term.</div>'; }
    list.querySelectorAll(".acc-head").forEach(h=>{
      h.onclick = ()=>{ h.parentElement.classList.toggle("open"); };
    });
  }
  draw("");
  document.getElementById("notesSearch").addEventListener("input", (e)=>draw(e.target.value));
}

/* ---------------- FLASHCARDS ---------------- */
function renderFlashcards(theme){
  const t = DATA[theme];
  if(!state.fc[theme]){
    state.fc[theme] = { idx: 0, order: t.flashcards.map((_,i)=>i), flipped:false };
  }
  const fs = state.fc[theme];
  const status = getFcStatus(theme);

  function currentCard(){ return t.flashcards[fs.order[fs.idx]]; }

  function draw(){
    const known = Object.values(status).filter(v=>v==="known").length;
    const learning = Object.values(status).filter(v=>v==="learning").length;
    const card = currentCard();
    const cardKey = fs.order[fs.idx];
    document.getElementById("main").innerHTML = `<div class="panel">
      <h2 class="section-title">${t.name} — Flashcards</h2>
      <div class="theme-desc">Click the card to flip. Mark each one so the app remembers what you still need to review.</div>
      <div class="fc-wrap">
        <div class="fc-stats">
          <span>Card <b>${fs.idx+1}</b> / ${t.flashcards.length}</span>
          <span>Know it: <b style="color:var(--good)">${known}</b></span>
          <span>Still learning: <b style="color:var(--bad)">${learning}</b></span>
        </div>
        <div class="fc-progress"><div class="fc-progress-fill" style="width:${((fs.idx+1)/t.flashcards.length*100).toFixed(0)}%"></div></div>
        <div class="fc-card ${fs.flipped?'flipped':''}" id="fcCard">
          <div class="fc-inner">
            <div class="fc-face fc-front">${esc(card.t)}<span class="fc-hint">Tap to flip</span></div>
            <div class="fc-face fc-back">${esc(card.d)}<span class="fc-hint">Tap to flip back</span></div>
          </div>
        </div>
        <div class="fc-controls">
          <button class="btn bad" id="fcLearning">Still learning</button>
          <button class="btn good" id="fcKnown">Know it &#10003;</button>
        </div>
        <div class="fc-controls">
          <button class="btn" id="fcPrev">&larr; Prev</button>
          <button class="btn" id="fcShuffle">Shuffle</button>
          <button class="btn" id="fcNext">Next &rarr;</button>
        </div>
      </div>
    </div>`;
    document.getElementById("fcCard").onclick = ()=>{ fs.flipped = !fs.flipped; draw(); };
    document.getElementById("fcNext").onclick = (e)=>{ e.stopPropagation(); fs.idx = (fs.idx+1) % t.flashcards.length; fs.flipped=false; draw(); };
    document.getElementById("fcPrev").onclick = (e)=>{ e.stopPropagation(); fs.idx = (fs.idx-1+t.flashcards.length) % t.flashcards.length; fs.flipped=false; draw(); };
    document.getElementById("fcShuffle").onclick = (e)=>{
      e.stopPropagation();
      for(let i=fs.order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [fs.order[i],fs.order[j]]=[fs.order[j],fs.order[i]]; }
      fs.idx=0; fs.flipped=false; draw();
    };
    document.getElementById("fcKnown").onclick = (e)=>{
      e.stopPropagation(); status[cardKey]="known"; setFcStatus(theme,status);
      fs.idx = (fs.idx+1) % t.flashcards.length; fs.flipped=false; draw();
    };
    document.getElementById("fcLearning").onclick = (e)=>{
      e.stopPropagation(); status[cardKey]="learning"; setFcStatus(theme,status);
      fs.idx = (fs.idx+1) % t.flashcards.length; fs.flipped=false; draw();
    };
  }
  draw();
}

/* ---------------- QUIZ ---------------- */
function renderQuiz(theme){
  const t = DATA[theme];
  if(!state.quiz[theme] || state.quiz[theme].done===undefined){
    state.quiz[theme] = { idx:0, score:0, answered:false, selected:-1, done:false, order: t.quiz.map((_,i)=>i) };
  }
  const qs = state.quiz[theme];

  function draw(){
    if(qs.idx >= t.quiz.length){
      const pct = Math.round(qs.score / t.quiz.length * 100);
      document.getElementById("main").innerHTML = `<div class="panel">
        <h2 class="section-title">${t.name} — Quiz Complete</h2>
        <div class="quiz-score">
          <div class="big">${qs.score} / ${t.quiz.length}</div>
          <div style="color:var(--sub);margin-top:6px;">${pct}% correct</div>
          <div style="margin-top:20px;"><button class="btn primary" id="quizRetake">Retake Quiz</button></div>
        </div>
      </div>`;
      document.getElementById("quizRetake").onclick = ()=>{
        state.quiz[theme] = { idx:0, score:0, answered:false, selected:-1, done:false, order: t.quiz.map((_,i)=>i) };
        draw();
      };
      return;
    }
    const q = t.quiz[qs.order[qs.idx]];
    let optsHtml = q.o.map((opt,i)=>{
      let cls = "quiz-opt" + (qs.answered ? " locked":"");
      if(qs.answered){
        if(i===q.a) cls += " correct";
        else if(i===qs.selected) cls += " incorrect";
      }
      return `<button class="${cls}" data-i="${i}" ${qs.answered?'disabled':''}>${esc(opt)}</button>`;
    }).join("");
    document.getElementById("main").innerHTML = `<div class="panel">
      <h2 class="section-title">${t.name} — Quiz</h2>
      <div class="quiz-progress">Question ${qs.idx+1} of ${t.quiz.length} &nbsp;·&nbsp; Score so far: ${qs.score}</div>
      <div class="quiz-q">${esc(q.q)}</div>
      <div id="quizOpts">${optsHtml}</div>
      ${qs.answered ? `<div class="quiz-explain"><b>${qs.selected===q.a?'Correct! ':'Not quite. '}</b>${esc(q.e)}</div>` : ""}
      <div class="quiz-footer">
        <span></span>
        ${qs.answered ? '<button class="btn primary" id="quizNext">Next &rarr;</button>' : ''}
      </div>
    </div>`;
    if(!qs.answered){
      document.querySelectorAll("#quizOpts .quiz-opt").forEach(b=>{
        b.onclick = ()=>{
          const i = parseInt(b.dataset.i);
          qs.selected = i; qs.answered = true;
          if(i===q.a) qs.score++;
          draw();
        };
      });
    } else {
      document.getElementById("quizNext").onclick = ()=>{
        qs.idx++; qs.answered=false; qs.selected=-1; draw();
      };
    }
  }
  draw();
}

/* ---------------- PRACTICE ---------------- */
function renderPractice(theme){
  const t = DATA[theme];
  let cards = t.practice.map((p,i)=>`
    <div class="pq-card">
      <div class="pq-head">
        <div class="pq-text"><span class="pq-num">Q${i+1}.</span>${esc(p.q)}</div>
        <div class="pq-marks">[${p.m} mark${p.m>1?'s':''}]</div>
      </div>
      <button class="pq-toggle" data-i="${i}">Show mark scheme</button>
      <div class="pq-ms" id="ms-${i}" style="display:none;">${esc(p.ms)}</div>
    </div>`).join("");
  document.getElementById("main").innerHTML = `<div class="panel">
    <h2 class="section-title">${t.name} — Practice Questions</h2>
    <div class="theme-desc">Exam-style questions with full mark schemes. Try each one before revealing the answer.</div>
    ${cards}
  </div>`;
  document.querySelectorAll(".pq-toggle").forEach(btn=>{
    btn.onclick = ()=>{
      const i = btn.dataset.i;
      const ms = document.getElementById("ms-"+i);
      const showing = ms.style.display !== "none";
      ms.style.display = showing ? "none" : "block";
      btn.textContent = showing ? "Show mark scheme" : "Hide mark scheme";
    };
  });
}

function renderWorksheet(theme){
  const t = DATA[theme];
  const fcSample = t.flashcards.slice(0, Math.min(8, t.flashcards.length));
  let fillCards = fcSample.map((c,i)=>`<div class="ws-fillcard"><b>${i+1}.</b> Define / explain: <b>${esc(c.t)}</b></div>`).join("");
  let qCards = t.practice.map((p,i)=>`
    <div class="pq-card">
      <div class="pq-head">
        <div class="pq-text"><span class="pq-num">Q${i+1}.</span>${esc(p.q)}</div>
        <div class="pq-marks">[${p.m} mark${p.m>1?'s':''}]</div>
      </div>
      <div class="ws-blank"></div>
    </div>`).join("");
  let answerKey = t.practice.map((p,i)=>`<div class="pq-card"><div class="pq-text"><b>A${i+1}.</b> ${esc(p.ms)}</div></div>`).join("");
  let fcAnswerKey = fcSample.map((c,i)=>`<div class="pq-card"><div class="pq-text"><b>${i+1}. ${esc(c.t)}</b> — ${esc(c.d)}</div></div>`).join("");

  document.getElementById("main").innerHTML = `<div class="panel">
    <h2 class="section-title">${t.name} — Printable Worksheet</h2>
    <div class="theme-desc">A print-ready worksheet: work through it on paper, then check the answer key at the end.</div>
    <div class="ws-actions">
      <button class="btn primary" id="printBtn">Print / Save as PDF</button>
    </div>
    <div class="ws-section-title">Section A — Key Term Recall</div>
    ${fillCards}
    <div class="ws-section-title">Section B — Exam-Style Questions</div>
    ${qCards}
    <div class="ws-answerkey">
      <div class="ws-section-title">Answer Key — Section A</div>
      ${fcAnswerKey}
      <div class="ws-section-title">Answer Key — Section B</div>
      ${answerKey}
    </div>
  </div>`;
  document.getElementById("printBtn").onclick = ()=>window.print();
}

/* ---------------- ROUTER ---------------- */
function renderMain(){
  renderModeTabs();
  const theme = state.theme;
  if(state.mode==="notes") renderNotes(theme);
  else if(state.mode==="flashcards") renderFlashcards(theme);
  else if(state.mode==="quiz") renderQuiz(theme);
  else if(state.mode==="practice") renderPractice(theme);
  else if(state.mode==="worksheet") renderWorksheet(theme);
}

function renderAll(){
  renderThemeTabs();
  renderMain();
}

renderAll();
</script>
</body>
</html>
